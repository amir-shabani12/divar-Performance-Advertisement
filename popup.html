<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      direction: rtl;
      background: #fff;
      color: #333;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 2px solid #e53935;
      padding-bottom: 10px;
    }
    .header h2 {
      color: #e53935;
      font-size: 15px;
    }
    .logo { font-size: 20px; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .btn-start { background: #e53935; color: white; }
    .btn-start:hover:not(:disabled) { background: #c62828; }
    .btn-stop { background: #757575; color: white; }
    .btn-stop:hover:not(:disabled) { background: #424242; }
    .btn:disabled { background: #bdbdbd; cursor: not-allowed; }
    .progress-wrap {
      display: none;
      margin: 10px 0 6px;
    }
    .progress-track {
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #e53935;
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-label {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    .status-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      min-height: 48px;
    }
    .status-box.done { background: #e8f5e9; color: #2e7d32; }
    .status-box.error { background: #ffebee; color: #c62828; }
    .status-box.running { background: #e3f2fd; color: #1565c0; }
    .ad-title {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tip {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      line-height: 1.5;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">📊</span>
    <h2>دیوار — استخراج آمار آگهی</h2>
  </div>

  <button class="btn btn-start" id="startBtn">▶ شروع استخراج</button>
  <button class="btn btn-stop" id="stopBtn" disabled>⏹ توقف</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div class="status-box" id="statusBox">آماده برای شروع</div>
  <div class="ad-title" id="adTitle"></div>

  <div class="tip">
    💡 ابتدا در دیوار لاگین کرده باشید. افزونه صفحه آگهی‌ها را خودکار باز می‌کند.
  </div>

  <script src="popup.js"></script>
</body>
</html>
